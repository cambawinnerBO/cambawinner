<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo transparente, lockup horizontal completo -->

  <!-- ISOTIPO -->
  <g transform="translate(10, 10)">
    <rect x="4" y="4" width="92" height="92" rx="18" fill="#0A2540"/>
    <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
    <!-- cancha sutil -->
    <line x1="50" y1="16" x2="50" y2="84" stroke="#1D9E75" stroke-width="0.7" opacity="0.15"/>
    <circle cx="50" cy="50" r="13" fill="none" stroke="#1D9E75" stroke-width="0.7" opacity="0.15"/>
    <circle cx="50" cy="50" r="1.5" fill="#1D9E75" opacity="0.35"/>
    <!-- C -->
    <path d="M 68 30 Q 60 22 47 22 Q 28 22 28 50 Q 28 78 47 78 Q 60 78 68 70" stroke="#1D9E75" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <!-- W -->
    <path d="M 35 48 L 41 62 L 46 53 L 51 62 L 56 48 L 61 62 L 68 43" stroke="#1D9E75" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
