    <circle cx="68" cy="43" r="1.8" fill="#0A2540"/>
  </g>

  <!-- WORDMARK -->
  <text x="126" y="62" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="600" fill="#F5F7FA" letter-spacing="-1">Camba</text>
  <text x="126" y="62" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="600" fill="#1D9E75" letter-spacing="-1">
